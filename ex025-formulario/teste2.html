<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>

    <h1>Preenha o formulário</h1>
    <form action="cadastro.js">
        <fieldset>
        <p>nome <input type="name" name="nome" id="nome" required minlength="8"></p>
    <p>Email:<input type="email" required></p>
    <p>Senha:<input type="senha" required></p>
    <p>Salário: <input type="number" name="num" id="inum"></p>
    <p>Mês o ultimo salario: <input type="month" name="mes" id="imes"></p>
    <p>Data de nascimento: <input type="date" name="aniversario" id="ianiversario">
    </p>
    <label for="itel">Telefone</label>
    <input type="number" name="tel" id="itel" autocomplete="(21)965535072" pattern="^\(\d{2}\)\d{4,5}-\d{4}$" required>
</fieldset>

<fieldset>
<legend>Pais favorito</legend>

<input type="checkbox" name="china" id="ichina"><label for="ichina">China</label>
<input type="checkbox" name="chile" id="ichile">Chile
<input type="checkbox" name="espanha" id="iespanha">Espanha
<input type="checkbox" name="croacia" id="icroacia">Croacia
<input type="checkbox" name="portugal" id="iportugal">Portugal
<input type="checkbox" name="italia" id="iitalia">Itália
<input type="checkbox" name="grecia" id="igrecia">Grécia


</fieldset>


    <input type="submit" value="Enviar">
    
</body>
</html>
